name: p2
description: A RealEstate.com.au inspired Flutter app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  panorama_viewer: ^2.0.7
  file_picker: ^10.3.3
  path_provider: ^2.0.15
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  google_sign_in: 6.1.0
  tflite_flutter: ^0.12.1
  image: ^4.8.0
  lottie: ^3.3.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geocoding: ^5.0.0
  flutter_launcher_icons: ^0.13.1 # Veya güncel sürüm

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/animations/
    - assets/room_model.tflite
flutter_icons:
  image_path: "assets/icon.png" # İkon olarak kullanmak istediğiniz ana görselin yolu
  android: true
  ios: true